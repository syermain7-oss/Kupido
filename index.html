<!DOCTYPE html>
<html lang="es">

    * {

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #120b10, #4b1025);
    }

    .card {
      width: 100%;
      max-width: 650px;
      padding: 45px 30px;
      text-align: center;
      background: #21131c;
      border: 1px solid #7d2948;
      border-radius: 24px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
    }

    h1 {
      margin: 0 0 15px;
      color: #ff668f;
      font-size: 44px;
    }

    h2 {
      margin: 0 auto 20px;
      max-width: 500px;
      font-size: 24px;
      font-weight: normal;
      line-height: 1.4;
    }

    p {
      color: #e8cbd5;
      font-size: 17px;
      line-height: 1.6;
    }

    .btn {
      display: block;
      margin: 16px auto;
      max-width: 380px;
      padding: 15px 20px;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 30px;
      background: #e83d70;
      transition: 0.3s;
    }

    .btn:hover {
      background: #ff668f;
      transform: scale(1.03);
    }

    .btn.facebook {
      background: #8b3155;
    }

    .btn.facebook:hover {
      background: #b94b73;
    }

    small {
      display: block;
      margin-top: 25px;
      color: #c9aab6;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .card {
        padding: 35px 20px;
      }

      h1 {
        font-size: 36px;
      }

      h2 {
        font-size: 21px;
      }
    }
  </style>
</head>
